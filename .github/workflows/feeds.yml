name: Feed check

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # Fails the job when one or more configured feeds no longer parse. That is
      # the notification: GitHub surfaces the failure in the Actions tab.
      - name: Check every configured feed
        run: uv run python build_tools/check_feeds.py
