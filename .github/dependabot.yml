version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"

  # bun.lock (the npx-era package-lock.json was removed).
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"

  # Base images are pinned by digest in the Dockerfile.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
