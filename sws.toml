[general]
root = "/app/static"
port = 8000
page404 = "./404.html"
cache-control-headers = true
host = "0.0.0.0"
compression = true
compression-static = true

# Security headers applied to every response. The CSP is sent as a real header
# (not a <meta>) so frame-ancestors and the other directives actually apply.
[[advanced.headers]]
source = "**/*"
headers.Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
headers.Content-Security-Policy = "default-src 'self'; script-src 'self' 'inline-speculation-rules'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://insoumis.goatcounter.com; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'"
headers.Cross-Origin-Opener-Policy = "same-origin"
headers.Cross-Origin-Resource-Policy = "same-origin"
headers.X-Content-Type-Options = "nosniff"
headers.Referrer-Policy = "same-origin"
headers.X-Frame-Options = "DENY"
headers.Permissions-Policy = "interest-cohort=(), browsing-topics=()"

# Advertise feed alternates on every HTML response
[[advanced.headers]]
source = "**/*.html"
headers.Link = "</feed.xml>; rel=\"alternate\"; type=\"application/rss+xml\"; title=\"Gazette Insoumise — RSS\", </feeds.opml>; rel=\"alternate\"; type=\"text/x-opml\"; title=\"Gazette Insoumise — OPML\""

# Cache deploy-time assets for 1 year. HTML, XML and JSON are regenerated (or
# reflect runtime state, like status.json), so they get a short TTL instead.
[[advanced.headers]]
source = "**/*.{css,woff2,avif,png,ico}"
headers.Cache-Control = "public, max-age=31536000, immutable"

[[advanced.headers]]
source = "**/*.{html,xml,json}"
headers.Cache-Control = "public, max-age=900"

# JS has a long cache, except sw.js which needs a short TTL for update propagation
[[advanced.headers]]
source = "**/js/*.js"
headers.Cache-Control = "public, max-age=31536000, immutable"

[[advanced.headers]]
source = "sw.js"
headers.Cache-Control = "public, max-age=900"
